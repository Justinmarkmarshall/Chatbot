name: chatbot-local
services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    environment:
      POSTGRES_DB: chatbot
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: ${CHATBOT_POSTGRES_PASSWORD:?Set CHATBOT_POSTGRES_PASSWORD for local development}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - chatbot-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  chatbot-data:

