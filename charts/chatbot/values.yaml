replicaCount: 1

# Provision PostgreSQL separately. Never put credentials in Helm values.
database:
  existingSecret: ""
  connectionStringKey: connection-string
  # Used when existingSecret (a complete connection string) is empty.
  host: chatbot-postgres
  port: 5432
  name: chatbot
  username: chatbot
  passwordSecret: chatbot-postgres-auth
  passwordKey: password

image:
  repository: ghcr.io/justinmarkmarshall/chatbot
  pullPolicy: Always
  tag: latest

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ollama:
  model: qwen3:1.7b
  # Use the existing Ollama Service; this chart does not deploy Ollama.
  # For another namespace use its full cluster DNS name.
  baseUrl: "http://ollama:11434"
  deploy:
    enabled: false
    image:
      repository: ollama/ollama
      tag: latest
      pullPolicy: IfNotPresent
    port: 11434
    # Pull .Values.ollama.model on pod start (cached on the PVC).
    pullModel: false
    persistence:
      enabled: true
      size: 5Gi
      storageClass: ""
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        memory: 3Gi  
    # For NVIDIA GPUs with the device plugin installed, use e.g.:
    # resources:
    #   requests:
    #     cpu: 500m
    #     memory: 4Gi
    #   limits:
    #     nvidia.com/gpu: 1

dataProtection:
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""

httpRoute:
  enabled: true
  hostnames:
    - chatbot.marshalllab.uk
  parentRefs:
    - name: public-gateway
      namespace: envoy-gateway-system
      sectionName: http
  # Gateway API route timeouts. "0s" disables the timeout entirely —
  # needed so long-running LLM responses don't get cut off with a 504
  # (Envoy's default route timeout is ~15s).
  timeouts:
    request: 5m
    backendRequest: 5m
    # backendRequest caps time waiting for the backend per attempt.
    # backendRequest: "0s"
     
imagePullSecrets: []
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 768Mi
authentication:
  # Existing Secret with client-id and client-secret keys.
  existingSecret: chatbot-google-auth

# Requires pgvector on the existing PostgreSQL server and provisioned offline model files.
documentProcessing:
  enabled: true
  # Optional legacy model PVC override. New images already contain /model-assets.
  modelExistingClaim: ""
  modelRoot: /model-assets
  replicaCount: 1
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      cpu: "1"
      memory: 1Gi
