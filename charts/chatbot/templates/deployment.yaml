apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chatbot.fullname" . }}
  labels:
    {{- include "chatbot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "chatbot.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "chatbot.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: chatbot
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
          env:
            - name: ASPNETCORE_URLS
              value: {{ printf "http://+:%v" .Values.service.targetPort | quote }}
            - name: Documents__ModelRoot
              value: {{ .Values.documentProcessing.modelRoot | quote }}
            {{- include "chatbot.databaseEnv" . | nindent 12 }}
            - name: Authentication__Google__ClientId
              valueFrom:
                secretKeyRef:
                  name: {{ required "authentication.existingSecret is required" .Values.authentication.existingSecret | quote }}
                  key: client-id
            - name: Authentication__Google__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authentication.existingSecret | quote }}
                  key: client-secret
            - name: Ollama__BaseUrl
              value: {{ required "ollama.baseUrl must point to the existing Ollama service" .Values.ollama.baseUrl | quote }}
            - name: Ollama__Model
              value: {{ .Values.ollama.model | quote }}
          volumeMounts:
            - name: data-protection-keys
              mountPath: /keys
            {{- if .Values.documentProcessing.modelExistingClaim }}
            - name: document-model
              mountPath: {{ .Values.documentProcessing.modelRoot | quote }}
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data-protection-keys
          persistentVolumeClaim:
            claimName: {{ include "chatbot.fullname" . }}-data-protection
        {{- if .Values.documentProcessing.modelExistingClaim }}
        - name: document-model
          persistentVolumeClaim:
            claimName: {{ .Values.documentProcessing.modelExistingClaim | quote }}
        {{- end }}
